<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agente de impresión</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f4;color:#17201f;font:14px "Segoe UI",Arial,sans-serif}
header{background:#fff;border-bottom:1px solid #dbe3dd;padding:14px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;margin-right:auto}.chip{padding:4px 10px;border-radius:999px;background:#eef3ef;font-size:12px}
main{max-width:1000px;margin:18px auto;padding:0 16px;display:grid;gap:16px}
section{background:#fff;border:1px solid #dbe3dd;border-radius:12px;padding:16px 18px}
h2{font-size:15px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
label{display:grid;gap:4px;font-weight:600;font-size:13px}label small{font-weight:400;color:#5a6a63}
input,select{padding:8px 10px;border:1px solid #cfdad2;border-radius:8px;font:inherit}
button{padding:8px 14px;border:1px solid #cfdad2;border-radius:8px;background:#fff;font:inherit;cursor:pointer}
button.primary{background:#c76648;border-color:#c76648;color:#fff}button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #edf1ee;vertical-align:top}
th{color:#5a6a63;font-weight:600}.estado{font-weight:700}.pendiente,.imprimiendo{color:#9a6a00}.impreso{color:#2f7a4a}.error{color:#a32020}
.msg{padding:9px 12px;border-radius:8px;margin:0}.ok{background:#e7f4eb}.mal{background:#fbe9e9}.muted{color:#5a6a63}
.acciones{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header><h1>Agente de impresión</h1><span class="chip" id="equipo">…</span><span class="chip" id="version"></span><span class="chip" id="resumen"></span></header>
<main>
  <p class="msg" id="mensaje" hidden></p>
  <section>
    <h2>Impresoras de esta PC</h2>
    <p class="muted" id="impresoras">Cargando…</p>
  </section>
  <section>
    <h2>Configuración</h2>
    <form id="config">
      <div class="grid">
        <label>Orígenes permitidos<input name="origenes"><small>URLs del sistema que pueden imprimir, separadas por coma.</small></label>
        <label>Impresora por defecto<select name="impresoraPorDefecto"></select><small>Se usa cuando el sistema no indica impresora.</small></label>
        <label>Puerto<input name="puerto" type="number" min="1024" max="65535"><small>Cambiarlo requiere reiniciar el agente.</small></label>
        <label>Trabajos guardados / máximo en cola<input name="cola.maxTrabajos" type="number" min="5" max="1000"></label>
        <label>Reintentos si falla<input name="cola.reintentos" type="number" min="0" max="20"></label>
        <label>Espera entre reintentos (seg)<input name="cola.esperaReintentoSeg" type="number" min="1" max="3600"></label>
        <label>Tamaño máximo por ticket (MB)<input name="cola.maxMB" type="number" min="1" max="50"></label>
        <label>Días de log<input name="log.dias" type="number" min="1" max="365"></label>
      </div>
      <p><button class="primary">Guardar configuración</button></p>
    </form>
  </section>
  <section>
    <h2>Cola de impresión</h2>
    <table><thead><tr><th>Fecha</th><th>Documento</th><th>Impresora</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="cola"></tbody></table>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const aviso = (texto, bien = true) => { const m = $('#mensaje'); m.hidden = !texto; m.textContent = texto; m.className = 'msg ' + (bien ? 'ok' : 'mal'); };
async function api(url, opciones) {
  const r = await fetch(url, opciones); const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Error'); return data;
}
let impresoras = [];
async function estado() {
  const e = await api('/estado');
  impresoras = e.impresoras;
  $('#equipo').textContent = 'PC: ' + e.equipo;
  $('#version').textContent = 'v' + e.version + ' · Java ' + e.java;
  $('#resumen').textContent = `${e.cola.pendientes} pendientes · ${e.cola.errores} con error`;
  $('#impresoras').innerHTML = e.impresoras.length ? e.impresoras.map(n => esc(n) + (n === e.predeterminadaWindows ? ' <b>(predeterminada de Windows)</b>' : '')).join('<br>') : 'No hay impresoras instaladas.';
}
async function config() {
  const c = await api('/config');
  const sel = $('select[name="impresoraPorDefecto"]');
  sel.innerHTML = '<option value="">Predeterminada de Windows</option>' + impresoras.map(n => `<option>${esc(n)}</option>`).join('');
  if (c.impresoraPorDefecto && !impresoras.includes(c.impresoraPorDefecto)) sel.insertAdjacentHTML('beforeend', `<option>${esc(c.impresoraPorDefecto)}</option>`);
  for (const [k, v] of Object.entries(c)) { const campo = document.querySelector(`[name="${k}"]`); if (campo) campo.value = v; }
}
async function cola() {
  const lista = await api('/cola');
  $('#cola').innerHTML = lista.length ? lista.map(t => `<tr>
    <td>${esc(t.creado)}${t.impreso ? `<br><small class="muted">Impreso ${esc(t.impreso)}</small>` : ''}</td>
    <td>${esc(t.documento)}</td><td>${esc(t.impresora || 'Por defecto')}</td>
    <td><span class="estado ${esc(t.estado)}">${esc(t.estado)}</span>${t.intentos ? ` <small class="muted">(${t.intentos} intentos)</small>` : ''}${t.error ? `<br><small class="error">${esc(t.error)}</small>` : ''}</td>
    <td class="acciones">${t.estado !== 'imprimiendo' ? `<button data-r="${esc(t.id)}">${t.estado === 'impreso' ? 'Reimprimir' : 'Reintentar'}</button><button data-e="${esc(t.id)}">Quitar</button>` : ''}</td></tr>`).join('')
    : '<tr><td colspan="5" class="muted">La cola está vacía.</td></tr>';
}
$('#cola').addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.r) await api(`/cola/${encodeURIComponent(b.dataset.r)}/reintentar`, { method: 'POST' });
    if (b.dataset.e) await api(`/cola/${encodeURIComponent(b.dataset.e)}`, { method: 'DELETE' });
    await cola(); await estado();
  } catch (e) { aviso(e.message, false); }
});
$('#config').addEventListener('submit', async ev => {
  ev.preventDefault();
  try {
    await api('/config', { method: 'PUT', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(new FormData(ev.target)) });
    aviso('Configuración guardada.'); await config();
  } catch (e) { aviso(e.message, false); }
});
(async () => { try { await estado(); await config(); await cola(); } catch (e) { aviso(e.message, false); } })();
setInterval(() => { cola().catch(() => {}); estado().catch(() => {}); }, 3000);
</script>
</body>
</html>
