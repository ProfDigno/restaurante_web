# Agente de impresión de Restaurante Web
# Se puede editar a mano (reiniciar el agente) o desde http://127.0.0.1:9123/

# Puerto local donde escucha el agente (solo 127.0.0.1). Si se cambia, hay que reiniciar el agente.
puerto=9123

# Direcciones del sistema que pueden imprimir, separadas por coma (ej.: https://hamburgus.ejemplo.com).
origenes=http://localhost:3003

# Impresora a usar cuando el sistema no indica una. Vacío = impresora predeterminada de Windows.
impresoraPorDefecto=

# Trabajos impresos que se guardan para reimprimir; también es el máximo de trabajos pendientes.
cola.maxTrabajos=50

# Veces que se reintenta un trabajo que falla antes de dejarlo en error.
cola.reintentos=3

# Segundos de espera entre reintentos.
cola.esperaReintentoSeg=10

# Tamaño máximo de cada ticket en MB.
cola.maxMB=5

# Días que se guardan los archivos de log.
log.dias=7
